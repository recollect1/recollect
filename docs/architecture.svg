<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12343b"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8741f"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#f4f7f4"/>
  <text x="40" y="50" font-size="30" font-weight="700" fill="#12343b">Recollect — architecture</text>
  <text x="40" y="78" font-size="16" fill="#58707a">Dark arrows: the request path (no model inside any tool, p95 &lt; 250 ms). Orange: background agents (models allowed, never write what she hears).</text>

  <!-- clients -->
  <rect x="40" y="110" width="300" height="200" rx="14" fill="#10172a"/>
  <text x="60" y="142" font-size="19" font-weight="700" fill="#eef2f7">Alexa+ simulator</text>
  <text x="60" y="168" font-size="14" fill="#a8b4c8">push-to-talk, story mode, MCP Apps</text>
  <text x="60" y="188" font-size="14" fill="#a8b4c8">cards, latency strip, simulated home,</text>
  <text x="60" y="208" font-size="14" fill="#a8b4c8">demo clock, live graph panel</text>
  <text x="60" y="238" font-size="14" fill="#2fd6f5">Amazon Bedrock Converse loop</text>
  <text x="60" y="258" font-size="14" fill="#2fd6f5">(≤ 4 tool calls a turn)</text>
  <text x="60" y="288" font-size="14" fill="#f2a93b">speaks a tool's say verbatim</text>

  <rect x="40" y="330" width="300" height="90" rx="14" fill="#fff" stroke="#cfdad4" stroke-width="2"/>
  <text x="60" y="362" font-size="19" font-weight="700" fill="#12343b">Claude Desktop</text>
  <text x="60" y="388" font-size="14" fill="#58707a">or any MCP host: same server, remote connector</text>

  <rect x="40" y="440" width="300" height="140" rx="14" fill="#fff" stroke="#cfdad4" stroke-width="2"/>
  <text x="60" y="472" font-size="19" font-weight="700" fill="#12343b">Family page</text>
  <text x="60" y="498" font-size="14" fill="#58707a">today, speech changes + doctor report,</text>
  <text x="60" y="518" font-size="14" fill="#58707a">stories, people, medicines, This is me,</text>
  <text x="60" y="538" font-size="14" fill="#58707a">two-step consent, delete everything,</text>
  <text x="60" y="558" font-size="14" fill="#58707a">night alerts</text>

  <!-- server -->
  <rect x="420" y="110" width="360" height="510" rx="16" fill="#fff" stroke="#12343b" stroke-width="2.5"/>
  <text x="442" y="144" font-size="20" font-weight="700" fill="#12343b">MCP server</text>
  <text x="442" y="168" font-size="14" fill="#58707a">Streamable HTTP · protocol 2025-11-25</text>
  <text x="442" y="188" font-size="14" fill="#58707a">bearer token → elder or family role</text>
  <g font-size="14" fill="#12343b">
    <text x="442" y="222" font-weight="700">16 tools, e.g.</text>
    <text x="442" y="244">remember_story · recall_memory ▣</text>
    <text x="442" y="264">whats_today ▣ · check_dose · log_dose</text>
    <text x="442" y="284">where_is · who_is ▣ · photo_moment ▣</text>
    <text x="442" y="304">night_reassure · routine_state</text>
    <text x="442" y="324">keep_private · pause_tracking</text>
    <text x="442" y="344">speech_trend ▣ · family_summary · this_is_me</text>
  </g>
  <text x="442" y="372" font-size="13" fill="#58707a">▣ = MCP Apps card · /api/family · /api/graph</text>
  <rect x="442" y="392" width="316" height="208" rx="10" fill="#fff4e6" stroke="#c8741f"/>
  <text x="458" y="418" font-size="15" font-weight="700" fill="#12343b">packages/core</text>
  <g font-size="13" fill="#12343b">
    <text x="458" y="442">phrases.ts — every sentence she hears</text>
    <text x="458" y="462">recall.ts — her quotes, never rewritten:</text>
    <text x="458" y="482">  local MiniLM embeddings + entity match</text>
    <text x="458" y="502">  + local cross-encoder relevance check</text>
    <text x="458" y="522">daily.ts — doses, today, who's who, routines</text>
    <text x="458" y="542">night.ts — reassurance + family alert</text>
    <text x="458" y="562">family.ts — consent, This is me, delete</text>
    <text x="458" y="582">Graph port: FalkorDB / in-memory</text>
  </g>

  <!-- graph -->
  <rect x="860" y="110" width="300" height="190" rx="14" fill="#12343b"/>
  <text x="880" y="144" font-size="20" font-weight="700" fill="#fff">FalkorDB</text>
  <g font-size="14" fill="#cfe1e6">
    <text x="880" y="170">Session → Quote → Entity, RETELLS</text>
    <text x="880" y="192">Person, Medicine, DoseEvent, AskEvent</text>
    <text x="880" y="214">MarkerSet, TrendCard, Consent, Profile</text>
    <text x="880" y="236">FamilyAlert, Job (queue)</text>
  </g>
  <text x="880" y="268" font-size="14" fill="#f2a93b">vector index on Quote.embedding</text>

  <!-- agents -->
  <rect x="860" y="340" width="300" height="250" rx="14" fill="#fff4e6" stroke="#c8741f" stroke-width="2"/>
  <text x="880" y="372" font-size="19" font-weight="700" fill="#12343b">Python agents</text>
  <g font-size="14" fill="#12343b">
    <text x="880" y="398">worker: polls Job nodes every 2 s</text>
    <text x="880" y="422" font-weight="700">extract (Strands → Bedrock)</text>
    <text x="880" y="442">  on AgentCore Runtime; spans validated</text>
    <text x="880" y="466" font-weight="700">markers (no model)</text>
    <text x="880" y="486">  text, graph, timing (VAD), audio deleted</text>
    <text x="880" y="510" font-weight="700">trends (no model)</text>
    <text x="880" y="530">  own baseline, 4-week rule, doctor report</text>
    <text x="880" y="554">synth: 12-week simulated history</text>
  </g>

  <rect x="860" y="620" width="300" height="70" rx="14" fill="#fff" stroke="#cfdad4" stroke-width="2"/>
  <text x="880" y="650" font-size="17" font-weight="700" fill="#12343b">Amazon SNS (optional)</text>
  <text x="880" y="674" font-size="14" fill="#58707a">night alert by SMS, sent in background</text>

  <!-- arrows -->
  <line x1="340" y1="210" x2="418" y2="210" stroke="#12343b" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="352" y="200" font-size="13" fill="#12343b">MCP</text>
  <line x1="340" y1="375" x2="418" y2="330" stroke="#12343b" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="340" y1="510" x2="418" y2="480" stroke="#12343b" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="346" y="530" font-size="13" fill="#12343b">REST</text>
  <line x1="780" y1="205" x2="858" y2="205" stroke="#12343b" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="790" y="195" font-size="13" fill="#12343b">Cypher</text>
  <line x1="1010" y1="338" x2="1010" y2="302" stroke="#c8741f" stroke-width="2.5" marker-end="url(#b)" marker-start="url(#b)"/>
  <path d="M 780 600 C 830 640, 830 655, 858 655" fill="none" stroke="#c8741f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#b)"/>
  <text x="600" y="720" font-size="14" fill="#58707a" text-anchor="middle">The worker finishes a job → the server reloads its recall index → new names are matched at once and appear in the graph panel.</text>
</svg>
